; PlatformIO build for the motion-triggered tracker in MotionTracker/.
; The Arduino IDE works too - see README.md.
; The libraries are bundled in MotionTracker/src/, so there are no lib_deps.
; The region flags below override MotionTracker/src/MCCI_LMIC/project_config/.

[platformio]
src_dir = MotionTracker
default_envs = ttgo-t-beam

[env:ttgo-t-beam]
platform = espressif32
board = ttgo-t-beam
framework = arduino
monitor_speed = 115200
build_flags =
    ; LoRaWAN region: replace CFG_eu868 with CFG_us915, CFG_au915, CFG_as923, ... if needed
    -D ARDUINO_LMIC_PROJECT_CONFIG_H_SUPPRESS
    -D CFG_eu868=1
    -D CFG_sx1276_radio=1
    ; avoids a clash with an ESP32 core symbol of the same name
    -D hal_init=LMICHAL_init

; Same firmware with the optional BME280 temperature/humidity/pressure sensor.
; Build with: pio run -e ttgo-t-beam-bme280 -t upload
[env:ttgo-t-beam-bme280]
extends = env:ttgo-t-beam
build_flags =
    ${env:ttgo-t-beam.build_flags}
    -D USE_BME280=1
