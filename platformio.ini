; PlatformIO build for the motion-triggered tracker in MotionTracker/.
; The Arduino IDE works too - see MotionTracker/README.md.

[platformio]
src_dir = MotionTracker

[env:ttgo-t-beam]
platform = espressif32
board = ttgo-t-beam
framework = arduino
monitor_speed = 115200
lib_deps =
    mcci-catena/MCCI LoRaWAN LMIC library@>=4.1.1
    mikalhart/TinyGPSPlus@>=1.0.3
    electroniccats/CayenneLPP@>=1.4.0
    lewisxhe/XPowersLib@>=0.2.6
build_flags =
    ; LoRaWAN region: replace CFG_eu868 with CFG_us915, CFG_au915, CFG_as923, ... if needed
    -D ARDUINO_LMIC_PROJECT_CONFIG_H_SUPPRESS
    -D CFG_eu868=1
    -D CFG_sx1276_radio=1
    ; avoids a clash with an ESP32 core symbol of the same name
    -D hal_init=LMICHAL_init
